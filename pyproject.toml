[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-split-spa"
version = "0.1.0"
description = "REX3 structural path analysis for disaggregated vegetable oil"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Izzu Prawiranegara" }]
dependencies = [
  "numpy>=2.0",
  "h5py>=3.10",
]

[project.urls]
Repository = "https://github.com/iprawiranegara/REX3_SPA"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
oil-split-spa = "oil_split_spa.cli:main"
